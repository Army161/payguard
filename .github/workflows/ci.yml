name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PayGuard is testnet only until a third party audit completes.
  PAYGUARD_ALLOW_MAINNET: 'false'

jobs:
  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install redis-server
        # The Redis store contract suite boots a real redis-server on a unix socket rather than
        # testing a fake, so the binary has to be present.
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Unit, attack class, and property tests with coverage gate
        run: pnpm run test:coverage

  security:
    name: SCA, secret scan, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=table

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.json --omit dev

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  live-testnet:
    name: nightly live testnet attack suite
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:live
        env:
          PAYGUARD_LIVE: '1'
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          XRPL_WSS_URL: ${{ secrets.XRPL_WSS_URL }}
