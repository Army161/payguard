name: nightly-live-testnet

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live testnet verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live rail verification against public testnets
        # The suite distinguishes three outcomes: pass (the chain answered and the rail decoded it
        # correctly), skip (the public endpoint was unhealthy or rate limited, with the reason
        # printed), and fail (the rail read real chain data and got it wrong). Only the third is
        # a red build, because a nightly that cries wolf at every upstream hiccup stops being read.
        run: pnpm run test:live
        env:
          PAYGUARD_LIVE: '1'
          # All optional. Left unset, the suite tries a built-in list of public endpoints and
          # falls back between them.
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
          XRPL_WSS_URL: ${{ vars.XRPL_WSS_URL }}
          # Set this for runners whose egress policy allows https only.
          XRPL_RPC_URL: ${{ vars.XRPL_RPC_URL }}
