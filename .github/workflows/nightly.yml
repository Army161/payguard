name: nightly-live-testnet

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live testnet verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live rail verification against public testnets
        run: pnpm run test:live
        env:
          PAYGUARD_LIVE: '1'
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL || 'https://sepolia.base.org' }}
          XRPL_WSS_URL: ${{ vars.XRPL_WSS_URL || 'wss://s.altnet.rippletest.net:51233' }}
          # Set XRPL_RPC_URL as a repository variable to run the XRPL live tests over JSON-RPC
          # instead, for runners whose egress policy allows https only.
          XRPL_RPC_URL: ${{ vars.XRPL_RPC_URL }}
